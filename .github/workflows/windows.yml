name: Build ASAB AeroLab for Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Verify Windows icon
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/icons/icon.ico")) { throw "Missing src-tauri/icons/icon.ico" }
          $bytes = [System.IO.File]::ReadAllBytes("src-tauri/icons/icon.ico")
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) { throw "Invalid ICO header" }
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: asab-aerolab-windows
          path: src-tauri/target/release/bundle/**/*
